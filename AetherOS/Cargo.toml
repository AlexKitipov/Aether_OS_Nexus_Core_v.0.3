[workspace]
resolver = "2"
members = [
    "kernel",
    "common",
    "vnode/registry",
    "vnode/init-service",
    "Nexus/UI/vnode/display-compositor",
    "Nexus/UI/vnode/webview"
]

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1

[patch.crates-io]
serde = "=1.0.227"
serde_derive = "=1.0.227"
