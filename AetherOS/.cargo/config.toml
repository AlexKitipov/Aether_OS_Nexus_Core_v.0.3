[env]
RUST_TARGET_PATH = "."

[target.'cfg(all())']
rustflags = [
    "--check-cfg=cfg(doc_cfg)"
]

[alias]
build-host = "build -p common"
build-kernel = "build --release --target x86_64-unknown-none.json -Zbuild-std=core,alloc,compiler_builtins -Zbuild-std-features=compiler-builtins-mem -p aetheros-kernel"
build-vnode-webview = "build --release --target x86_64-unknown-none.json -Zbuild-std=core -Zbuild-std-features=compiler-builtins-mem -p webview"
build-vnode-display-compositor = "build --release --target x86_64-unknown-none.json -Zbuild-std=core -Zbuild-std-features=compiler-builtins-mem -p display-compositor"
build-baremetal-all = "build --release --workspace --target x86_64-unknown-none.json"
