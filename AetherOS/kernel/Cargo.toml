[package]
name = "aetheros-kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { workspace = true }
aetheros_common = { path = "../common", default-features = false, features = ["alloc"] }
bootloader_api = { workspace = true, default-features = false }
x86_64 = { version = "0.14.9", default-features = false, features = ["instructions", "abi_x86_interrupt"] }
spin = { version = "0.9.8", default-features = false, features = ["mutex", "spin_mutex", "rwlock", "once", "lazy", "barrier"] }
conquer-once = { version = "0.4.0", default-features = false }
linked_list_allocator = { workspace = true }
postcard = { workspace = true }
sha2 = { version = "0.10", default-features = false }

[build-dependencies]
# Keep a legacy `bootloader` dependency so metadata-driven legacy tooling
# (for example `cargo-bootimage`) can resolve its expected crate.
# We pin it as a build-dependency to avoid pulling it into the kernel target build.
bootloader = { version = "0.11.15", default-features = false }


[features]
default = ["alloc"]
alloc = []
bare_metal = []
