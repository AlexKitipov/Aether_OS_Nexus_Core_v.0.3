[package]
name = "init-service"
version = "0.1.0"
edition = "2021"

[dependencies]
alloc = { package = "alloc", version = "0.0.0", optional = true }
linked_list_allocator = "0.10"
aetheros_common = { path = "../../common" }
serde = { version = "=1.0.227", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1.0", default-features = false, features = ["alloc"] }

[[bin]]
name = "init-service"
path = "src/main.rs"
